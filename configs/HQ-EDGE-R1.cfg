! ==========================================
! Device: HQ-EDGE-R1 (Cisco 2911 Router)
! Role: Border Gateway / NAT / OSPF ABR / ACL
! ==========================================
hostname HQ-EDGE-R1

interface GigabitEthernet0/0
 description Transit Link to Core Switch
 ip address 172.16.1.1 255.255.255.252
 ip nat inside
 no shutdown
exit

interface GigabitEthernet0/1
 description WAN Gateway to ISP-DNS
 ip address 8.8.8.1 255.255.255.0
 ip nat outside
 no shutdown
exit

interface GigabitEthernet0/2
 description Inter-Branch Link to BRANCH-R2
 ip address 192.168.255.1 255.255.255.252
 ip nat inside
 ip access-group PERIMETER-HARDENING in
 no shutdown
exit

ip route 0.0.0.0 0.0.0.0 8.8.8.8

router ospf 1
 router-id 2.2.2.2
 network 172.16.1.0 0.0.0.3 area 0
 network 192.168.255.0 0.0.0.3 area 0
 default-information originate
exit

ip access-list extended PERIMETER-HARDENING
 permit tcp any any established
 permit icmp any any echo-reply
 deny ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255
 permit ip any any
exit

access-list 1 permit 10.10.0.0 0.0.255.255
ip nat inside source list 1 interface GigabitEthernet0/1 overload
end
