! ==========================================
! Device: BRANCH-R2 (Cisco 2911 Router)
! Role: Branch Gateway / OSPF Area 1
! ==========================================
hostname BRANCH-R2

interface GigabitEthernet0/0
 description Uplink to HQ-EDGE-R1
 ip address 192.168.255.2 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/1
 description Gateway for Branch LAN
 ip address 10.10.30.1 255.255.255.0
 no shutdown
exit

router ospf 1
 router-id 3.3.3.3
 network 192.168.255.0 0.0.0.3 area 0
 network 10.10.30.0 0.0.0.255 area 1
exit
end
