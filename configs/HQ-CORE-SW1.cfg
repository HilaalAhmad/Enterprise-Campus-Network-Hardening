! ==========================================
! Device: HQ-CORE-SW1 (Cisco Catalyst 3560)
! Role: Core Layer 3 Switch / SVI Routing
! ==========================================
hostname HQ-CORE-SW1
ip routing

vlan 10
 name Management
vlan 20
 name IT-Dept
vlan 99
 name NativeVLAN
exit

interface GigabitEthernet0/1
 no switchport
 description Uplink to HQ-EDGE-R1
 ip address 172.16.1.2 255.255.255.252
 no shutdown
exit

interface GigabitEthernet0/2
 description Trunk to ACCESS-SW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 no shutdown
exit

interface Vlan10
 description SVI Gateway Management
 ip address 10.10.10.1 255.255.255.0
 no shutdown
exit

interface Vlan20
 description SVI Gateway IT-Dept
 ip address 10.10.20.1 255.255.255.0
 no shutdown
exit

router ospf 1
 router-id 1.1.1.1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.3 area 0
exit

ip route 0.0.0.0 0.0.0.0 172.16.1.1
end
